<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaxWazobia Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">
  <div class="w-full max-w-md bg-white shadow-xl rounded-2xl p-4 flex flex-col h-[85vh]">
    <h1 class="text-2xl font-bold text-center text-green-700 mb-4">💬 TaxWazobia Chat</h1>
    <div id="chat-box" class="flex-1 overflow-y-auto border p-3 rounded mb-3 bg-gray-50"></div>
    <div class="flex">
      <input id="user-input" type="text" placeholder="Ask about Nigerian tax..." 
             class="flex-1 border rounded-l px-3 py-2 focus:outline-none">
      <button id="send-btn" class="bg-green-700 text-white px-4 py-2 rounded-r">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;
      chatBox.innerHTML += `<div class='text-right text-blue-700 mb-2'><b>You:</b> ${message}</div>`;
      userInput.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message })
      });

      const data = await res.json();
      chatBox.innerHTML += `<div class='text-left text-gray-800 mb-2'><b>Bot:</b> ${data.reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
